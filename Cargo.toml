[package]
name = "wordle-solver"
version = "0.1.0"
edition = "2021"
description = "NYTimes Wordle solver with TUI; NYT hard-mode rules always enforced"
default-run = "wordle-solver"

[[bin]]
name = "solver-quality"
path = "src/bin/solver-quality.rs"

[[bin]]
name = "opening-benchmark"
path = "src/bin/opening-benchmark.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
