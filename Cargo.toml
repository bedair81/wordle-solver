[package]
name = "wordle-solver"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "NYTimes Wordle solver with TUI, headless CLI, entropy/minimax strategy, and NYT hard-mode support"
license = "MIT"
repository = "https://github.com/bedair81/wordle-solver"
readme = "README.md"
keywords = ["wordle", "solver", "tui", "entropy", "game"]
categories = ["games", "command-line-utilities"]
default-run = "wordle-solver"

[[bin]]
name = "solver-quality"
path = "src/bin/solver-quality.rs"

[[bin]]
name = "opening-benchmark"
path = "src/bin/opening-benchmark.rs"

[[bin]]
name = "suggestion-latency"
path = "src/bin/suggestion-latency.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rayon = "1.10"

[dev-dependencies]
